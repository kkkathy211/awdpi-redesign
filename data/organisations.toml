# 四个 AWDPI 主体的法律信息
#
# 网站从这个文件生成：/organisations/、/uk/、/be/、/us/、/au/ 五个法律信息页，
# 隐私声明页里的名称、地址和编号（content/en/*/privacy.md 里的 {{< org uk legalName >}}），
# 每个页面页脚的法律信息一行，以及关于页上的四张主体卡片。
# 改完后运行 hugo server 预览。

# 填写规则（各主体当地管理员）：
# - 所有字段从登记机关的记录里逐字复制，标点、大小写和缩写保持原样，不要翻译或改写。
# - 还没有的数据写 "TBD"，页面上显示为 TBD。
# - 链接（registerURL、statutesURL）填完整的 https:// 地址。
# - privacyURL 填站内路径，例如 "/uk/privacy/"；隐私声明正文在 content/en/<id>/privacy.md。
# - 改完后把 lastUpdated 改成当天日期，格式 "YYYY-MM-DD"。
# - 这个文件和页面都是公开的：只放公开信息。不放管理员邮箱、银行账号、内部电话、
#   私人邮箱或手机号、个案信息，也不放未经本人同意的姓名。
#
# 下面的顺序就是页脚和 /organisations 的显示顺序。
# code 是页面上的国家代码，colour 是卡片颜色（orange / yellow / red / pink，和首页地图一致）。

[[org]]
id = "uk"
code = "UK"
colour = "orange"
name = "AWDPI United Kingdom"
country = "United Kingdom"
countryZh = "英国"
# 以下取自登记证书和 Charity Commission 登记记录（2026-11-14 核对）
legalName = "ASIAN WOMEN DEVELOPMENT PLAN INTERNATIONAL (UK)"
jurisdiction = "England and Wales"
# 登记册上的 Organisation type 是 CIO；CIO 没有公司号，所以不填 companyNumber
organisationType = "Charitable incorporated organisation (CIO)"
regulator = "Charity Commission for England and Wales"
workingName = "AVOICE"          # 登记册上的 Other names（Working name）
idLabel = "Charity number"
footerLabel = "registered charity no."
footerLabelZh = "注册慈善机构编号"
registrationNumber = "1204406"
# 地址按登记册逐字照抄（含 "Storey's way" 小写和 "Cambrigeshire" 拼写）；登记册改正后这里同步改
registeredAddress = "Churchill College, Storey's way, CAMBRIDGE, Cambrigeshire, CB3 0DS"
registerURL = "https://register-of-charities.charitycommission.gov.uk/en/charity-search/-/charity-details/5203820"
email = "uk@awdpi.org"
phone = "+44 7536 937036"       # 和登记册上的电话一致
# 简介请英国管理员确认
about = """\
  AWDPI United Kingdom supports Asian women in England and Wales who are affected by domestic \
  violence, gender-based violence or discrimination. It runs a relief and referral system that \
  connects women with help, builds a community where Asian women can share, learn and support each \
  other, and supports their career development. It also raises awareness of the challenges overseas \
  Asian women face through research and public education.\
  """
hostsSecretariat = true
donations = ""                  # 登记册显示 Not recognised by HMRC for gift aid，所以不显示捐款一栏
privacyURL = "/uk/privacy/"
lastUpdated = "2026-11-14"

