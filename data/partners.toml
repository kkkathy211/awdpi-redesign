# 关于页"400+ 合作伙伴"一栏的机构标志。
# 每个分组一段，顺序就是页面上的顺序。标志文件放在 static/img/partners/，优先用 SVG。
#   name    英文名称（显示在标志下方，也是图片的替代文字）
#   nameZh  中文名称（中文页使用；没有就用英文名称）
#   logo    标志文件名；暂时没有标志时留空，页面会用 short（或名称）显示一个文字标志
#   shape   可选：wide（很宽的横版标志）或 tall（竖版或圆形标志），用来微调大小

