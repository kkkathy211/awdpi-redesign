# ---------------------------------------------------------------- content folders

# content/en and content/zh-cn hold each language's pages.
# content/stories holds the articles (written in Chinese); every article appears in both languages,
# at /stories/<name>/ and /zh-cn/stories/<name>/, and its images are in static/media/stories/.
[[module.mounts]]
  source = "content/en"
  target = "content"
  [module.mounts.sites.matrix]
    languages = ["en"]
[[module.mounts]]
  source = "content/zh-cn"
  target = "content"
  [module.mounts.sites.matrix]
    languages = ["zh-cn"]
[[module.mounts]]
  source = "content/stories"
  target = "content/stories"
  [module.mounts.sites.matrix]
    languages = ["en", "zh-cn"]
