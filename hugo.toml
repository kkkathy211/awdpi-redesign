# AWDPI website. Build with `hugo`, preview with `hugo server`. See README.md.

baseURL = "https://awdpi.org/"
title = "AWDPI"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
# Links in the output are written relative to each page, so the same build also works from a sub-path
# (for example a GitHub Pages preview at https://<user>.github.io/<repo>/).
# Keep baseURL at the site root and do not pass --baseURL with a sub-path: relativeURLs would then add it twice.
relativeURLs = true
enableRobotsTXT = true
disableHugoGeneratorInject = true
# Keep capitals in paths, such as /reports/2025_AWDPI_Five-Year_Impact_Report.pdf
disablePathToLower = true
disableKinds = ["taxonomy", "term", "rss"]

[params]
  # While the site is a preview: every page carries "noindex" and robots.txt blocks crawlers.
  # Set to false when the site goes live at awdpi.org.
  preview = true
  # Shown when a page is shared on social media.
  shareImage = "/share.jpg"
  # The public address, shown as text on the legal pages (links themselves stay relative).
  address = "https://awdpi.org/"
  # The Avoice AI assistant (Coze). Its server only lets awdpi.org show it inside a page; on any other address
  # (such as the GitHub Pages preview) the chat panel offers it in a new tab instead. Remove to hide the chat.
  chatWidget = "https://rzxfhy9z8w.coze.site/widget"

[security]
  # Pages are written as HTML files (content/**/*.html); Hugo blocks that by default.
  allowContent = [".*"]

[markup.goldmark.renderer]
  unsafe = true
[markup.goldmark.extensions.typographer]
  # keep straight quotes, as typed
  disable = true

[sitemap]
  changeFreq = ""
  priority = -1

